name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit and integration tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: node --version
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test

  docker-smoke:
    name: Docker compose smoke test (simulator + restart)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build and start with compose
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 1
          done
          docker compose logs; exit 1
      - name: Run simulator (138 events) and verify dashboards
        run: node scripts/simulate.js --url http://localhost:3000 --seed 42 --count 120 --verify --strict
      - name: Re-create the container and check data persisted on the named volume
        # `down` (without -v) removes the container and its anonymous volumes; only the named volume
        # `tracker-data` survives. A plain `restart` would keep the same container (review R2).
        run: |
          before=$(curl -fsS http://localhost:3000/api/players)
          docker compose down
          docker compose up -d
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health >/dev/null && break; sleep 1; done
          after=$(curl -fsS http://localhost:3000/api/players)
          echo "before: $before"; echo "after:  $after"
          test "$before" = "$after"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
